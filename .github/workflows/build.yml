name: Build Debian ARM64 for Samsung phone

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y debootstrap qemu-user-static binfmt-support e2fsprogs rsync xz-utils gzip zip git ca-certificates sudo

      - name: Build Debian ARM64 root filesystem
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -eux

          ROOTFS="$GITHUB_WORKSPACE/debian-rootfs"
          IMAGE="$GITHUB_WORKSPACE/debian-a205f-debian-bookworm-arm64.ext4"

          sudo rm -rf "$ROOTFS"
          mkdir -p "$ROOTFS"

          sudo debootstrap \
            --arch=arm64 \
            --foreign \
            bookworm \
            "$ROOTFS" \
            http://deb.debian.org/debian

          sudo cp /usr/bin/qemu-aarch64-static \
            "$ROOTFS/usr/bin/qemu-aarch64-static"

          sudo chroot "$ROOTFS" /debootstrap/debootstrap --second-stage

          sudo mount --bind /dev "$ROOTFS/dev"
          sudo mount --bind /dev/pts "$ROOTFS/dev/pts"
          sudo mount -t proc /proc "$ROOTFS/proc"
          sudo mount -t sysfs /sys "$ROOTFS/sys"

          cleanup() {
            sudo umount -lf "$ROOTFS/dev/pts" || true
            sudo umount -lf "$ROOTFS/dev" || true
            sudo umount -lf "$ROOTFS/proc" || true
            sudo umount -lf "$ROOTFS/sys" || true
          }

          trap cleanup EXIT

          sudo cp rootfs/firstboot.sh "$ROOTFS/usr/local/sbin/firstboot.sh"
          sudo chmod 0755 "$ROOTFS/usr/local/sbin/firstboot.sh"

          sudo chroot "$ROOTFS" /bin/bash -c '
            set -eux

            export DEBIAN_FRONTEND=noninteractive

            printf "%s
" "debian-a205f" > /etc/hostname

            cat > /etc/hosts <<EOF
127.0.0.1 localhost
127.0.1.1 debian-a205f
::1 localhost ip6-localhost ip6-loopback
EOF

            cat > /etc/apt/sources.list <<EOF
deb http://deb.debian.org/debian bookworm main contrib non-free non-free-firmware
deb http://deb.debian.org/debian bookworm-updates main contrib non-free non-free-firmware
deb http://security.debian.org/debian-security bookworm-security main contrib non-free non-free-firmware
EOF

            apt-get update

            apt-get install -y \
              systemd \
              systemd-sysv \
              dbus \
              sudo \
              openssh-server \
              network-manager \
              iproute2 \
              iputils-ping \
              net-tools \
              curl \
              wget \
              nano \
              vim-tiny \
              ca-certificates \
              bash-completion \
              procps \
              psmisc \
              kmod \
              usbutils \
              pciutils \
              rsync \
              htop

            useradd -m -s /bin/bash user || true
            echo "user:debian" | chpasswd
            usermod -aG sudo,audio,video,input,plugdev user

            echo "root:root" | chpasswd

            systemctl enable ssh || true
            systemctl enable NetworkManager || true

            rm -f /usr/bin/qemu-aarch64-static
            rm -rf /var/lib/apt/lists/*
            rm -rf /tmp/*
            rm -rf /var/tmp/*
          '

          sudo rm -f "$ROOTFS/usr/bin/qemu-aarch64-static"

          sudo mkdir -p "$ROOTFS/etc/systemd/system"

          sudo tee "$ROOTFS/etc/systemd/system/firstboot.service" > /dev/null <<'EOF'
[Unit]
Description=Debian phone first boot setup
After=local-fs.target
Before=ssh.service

[Service]
Type=oneshot
ExecStart=/usr/local/sbin/firstboot.sh
RemainAfterExit=yes

[Install]
WantedBy=multi-user.target
EOF

          sudo chroot "$ROOTFS" systemctl enable firstboot.service || true

          sudo truncate -s 2G "$IMAGE"
          sudo mkfs.ext4 -F -L DEBIAN "$IMAGE"

          sudo mkdir -p /mnt/debian-image
          sudo mount -o loop "$IMAGE" /mnt/debian-image
          sudo rsync -aHAX --numeric-ids "$ROOTFS/" /mnt/debian-image/
          sync
          sudo umount /mnt/debian-image

          sudo xz -T0 -z -f "$IMAGE"

      - name: Create checksums
        run: |
          sha256sum debian-a205f-debian-bookworm-arm64.ext4.xz \
            > debian-a205f-debian-bookworm-arm64.ext4.xz.sha256

      - name: Upload Debian image
        uses: actions/upload-artifact@v4
        with:
          name: debian-a205f-bookworm-arm64
          path: |
            debian-a205f-debian-bookworm-arm64.ext4.xz
            debian-a205f-debian-bookworm-arm64.ext4.xz.sha256
          retention-days: 30
